<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad-PawConnect</title>
    <link rel="icon" type="image/jpeg" href="./images/logoPawConnect.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
            }
        }
    </script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="./images/logoPawConnect.jpeg" alt="logo-img" width="120">
            </div>
            
            <div class="nav-buttons">
                <button id="modoOscuro" class="dark-btn">
                    🌙
                </button>
                
                <button id="hamburger-btn" class="hamburger-btn block md:hidden">
                    ☰
                </button>
            </div>
        </div>

        <ul id="menu-list" class="hidden w-full md:flex md:w-auto flex-col md:flex-row nav-links text-center">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="./adopcion.html">Adopción</a></li>
            <li><a href="./perdidos.html">Perdidos</a></li>
            <li><a href="./comunidad.html">Comunidad</a></li>
        </ul>
    </header>

    <section class="community-hero">
        <h1>Historias que conectan 🐾</h1>
        <p>
            Comparte experiences, adopciones y ayuda a crecer nuestra comunidad.
        </p>
    </section>

    <div class="create-post">
        <img src="./images/pet_pata.jpg" alt="pet_pata">
        <input type="text" placeholder="Comparte algo con la comunidad...">
        <button>Publicar</button>
    </div>

    <section class="feed">
        <div class="feed-post">
            <div class="feed-header">
                <img src="./images/user_1.jpeg" alt="Piero">
                <div>
                    <h2>Piero Ybañez</h2>
                    <span>Hace 2 horas</span>
                </div>
            </div>
            <p>
                ¡Milo finalmente encontró un hogar lleno de amor! 💛
            </p>
            <img class="feed-image" src="./images/mailo.jpg" alt="Mailo">
            <div class="feed-actions">
                <button>❤️ Me gusta</button>
                <button>💬 Comentarios</button>
                <button>🔗 Compartir</button>
            </div>
        </div>

        <div class="feed-post">
            <div class="feed-header">
                <img src="./images/val.jpg" alt="Vale">
                <div>
                    <h2>Vale Chavez</h2>
                    <span>Hace 5 horas</span>
                </div>
            </div>
            <p>
                Gracias a PawConnect encontramos a Botitas ✨
            </p>
            <img class="feed-image" src="./images/botas.jpg" alt="botas">
            <div class="feed-actions">
                <button>❤️ Me gusta</button>
                <button>💬 Comentarios</button>
                <button>🔗 Compartir</button>
            </div>
        </div>
    </section>

    <script>
        // Hamburguesa
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const menuList = document.getElementById('menu-list');

        hamburgerBtn.addEventListener('click', () => {
            menuList.classList.toggle('hidden');
            menuList.classList.toggle('flex');
        });

        // Modo Oscuro
        const btnModoOscuro = document.getElementById('modoOscuro');
        btnModoOscuro.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            if (document.body.classList.contains('dark')) {
                btnModoOscuro.textContent = '☀️';
            } else {
                btnModoOscuro.textContent = '🌙';
            }
        });
    </script>
</body>
</html>
